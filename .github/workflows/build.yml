name: Build Android APK

on:
  push:
    branches: ['**']        # every push to any branch (tags excluded)
  workflow_dispatch:         # "Run workflow" button in the Actions tab

permissions:
  contents: write            # needed to create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repo only keeps the app code (lib/) and our custom MainActivity.
      # `flutter create` fills in the rest of the Android project without
      # overwriting files that already exist.
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org com.kalyan --project-name flashlight .
          # Friendly app name on the home screen
          sed -i 's/android:label="flashlight"/android:label="Flashlight"/' android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Flashlight-v1.0.0-build${{ github.run_number }}.apk"
          ls -lh dist

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flashlight-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Flashlight build ${{ github.run_number }}
          body: |
            Automatic build from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
            Download the .apk below and open it on your Android phone to install.
          files: dist/*.apk
          make_latest: true
